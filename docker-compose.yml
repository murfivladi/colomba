# VPS: бэкенд, база и файлы в Docker. API — https://colomba-api.vladinc.ru:5576,
# TLS терминирует сам бэкенд сертификатом Let's Encrypt (./certs кладёт деплой и хук продления).
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-colomba}
      MARIADB_USER: ${DB_USER:-colomba}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  api:
    container_name: colomba-api
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      MEDIA_DIR: /data/media
      PORT: 5576
      TLS_CERT_FILE: /certs/fullchain.pem
      TLS_KEY_FILE: /certs/privkey.pem
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5576:5576"
    volumes:
      - media:/data/media
      - ./certs:/certs:ro

volumes:
  db:
  media:
