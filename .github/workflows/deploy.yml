name: Deploy

# Тесты → бэкенд на VPS (Docker, HTTPS прямо в бэкенде на :5576, сертификат certbot)
# → фронт (PWA) и PHP-прокси API: собираются здесь, архив уходит на VPS, а VPS заливает его
#   на shared-хостинг по FTP (lftp) и проверяет прокси.
# Браузер ходит только на vladinc.ru/colomba/api — PHP-прокси пересылает запросы на бэкенд,
# а бэкенд принимает их только с общим секретом PROXY_SECRET.
#
# Секреты (Settings → Secrets and variables → Actions):
#   VPS_IP, VPS_USER, VPS_PASS          — доступ к VPS по SSH (пароль)
#   FTP_HOST, FTP_USER, FTP_PASS         — FTP shared-хостинга (подключается VPS, не GitHub)
#   FTP_PORT       (необязательно)       — порт FTP, по умолчанию 21
#   FTP_DIR        (необязательно)       — каталог сайта на FTP, по умолчанию /colomba/
#   PROXY_SECRET                         — общий секрет PHP-прокси и бэкенда (длинная случайная строка)
#   CERTBOT_EMAIL  (необязательно)       — почта для Let's Encrypt
#   ORS_API_KEY, GRAPHHOPPER_API_KEY, SMTP_URL, MAIL_FROM, ADMIN_EMAILS (необязательно)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  API_DOMAIN: colomba-api.vladinc.ru
  API_PORT: '5576'
  PUBLIC_URL: https://vladinc.ru/colomba

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: colomba_test
          MARIADB_USER: colomba
          MARIADB_PASSWORD: colomba
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          if [ ${#PROXY_SECRET} -lt 24 ]; then
            echo "::error::Задайте секрет PROXY_SECRET (не короче 24 символов), например: openssl rand -hex 32"
            exit 1
          fi

      - name: Pack release
        run: |
          mkdir -p release
          git archive --format=tar.gz -o release/colomba-deploy.tar.gz HEAD
          cp deploy/remote-deploy.sh release/

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          source: release/colomba-deploy.tar.gz,release/remote-deploy.sh
          target: /tmp/colomba-deploy
          strip_components: 1

      - name: Certificate + docker compose up
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ env.API_DOMAIN }}
          API_PORT: ${{ env.API_PORT }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          CORS_ORIGINS: https://vladinc.ru,https://www.vladinc.ru
          WEBAUTHN_RP_ID: vladinc.ru
          INVITE_ONLY: 'true'
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          GRAPHHOPPER_API_KEY: ${{ secrets.GRAPHHOPPER_API_KEY }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          command_timeout: 30m
          envs: DOMAIN,API_PORT,PUBLIC_URL,CORS_ORIGINS,WEBAUTHN_RP_ID,INVITE_ONLY,PROXY_SECRET,CERTBOT_EMAIL,ORS_API_KEY,GRAPHHOPPER_API_KEY,SMTP_URL,MAIL_FROM,ADMIN_EMAILS
          script: BUNDLE=/tmp/colomba-deploy/colomba-deploy.tar.gz bash /tmp/colomba-deploy/remote-deploy.sh

      - name: Check API from the internet
        run: |
          for i in $(seq 1 10); do
            curl -fsS "https://${API_DOMAIN}:${API_PORT}/api/health" && exit 0
            sleep 6
          done
          echo "API is not reachable at https://${API_DOMAIN}:${API_PORT}" >&2
          exit 1

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build PWA + PHP proxy
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          # API — тот же адрес, что и сайт: /colomba/api (PHP-прокси)
          npm run build -w web
          cp deploy/.htaccess web/dist/.htaccess
          # настройки прокси: адрес бэкенда и общий секрет (файл не попадает в репозиторий)
          php -r '$c = ["backend" => "https://" . getenv("API_DOMAIN") . ":" . getenv("API_PORT"), "secret" => getenv("PROXY_SECRET")];
                  file_put_contents("web/dist/api/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");'
          php -l web/dist/api/config.php
          php -l web/dist/api/index.php

      - name: Pack frontend
        run: |
          mkdir -p release
          tar -czf release/colomba-web.tar.gz -C web/dist .
          cp deploy/remote-frontend.sh release/

      # FTP хостинга — с VPS (из GitHub Actions он может быть недоступен или медленным)
      - name: Upload frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          source: release/colomba-web.tar.gz,release/remote-frontend.sh
          target: /tmp/colomba-front
          strip_components: 1

      - name: VPS → FTP, check the PHP proxy
        uses: appleboy/ssh-action@v1.2.0
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR || '/colomba/' }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          command_timeout: 20m
          envs: FTP_HOST,FTP_PORT,FTP_USER,FTP_PASS,FTP_DIR,PUBLIC_URL
          script: BUNDLE=/tmp/colomba-front/colomba-web.tar.gz bash /tmp/colomba-front/remote-frontend.sh
